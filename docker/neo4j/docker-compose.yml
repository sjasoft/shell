version: '3.9'

services:
  neo4j:
    image: neo4j:community
    container_name: neo4j
    ports:
      - "7474:7474"  # HTTP port
      - "7687:7687"  # Bolt port
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_conf:/conf
    environment:
      - NEO4J_AUTH=none  # Disable authentication
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_conf:
